<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chicken Cross</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--page:#0c1712;--txt:#f4f7f2;--mut:rgba(244,247,242,.62);--glass:rgba(14,26,20,.58);--line:rgba(255,255,255,.14);--a1:#ffcf4a;--a2:#ff8a1f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#0c1712}}
:root[data-theme="dark"]{--page:#0c1712}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--page);color:var(--txt);font-family:Sora,system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;justify-content:center;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid var(--a1);outline-offset:2px}
#app{width:100%;max-width:460px;height:100%;display:flex;flex-direction:column}
#stage{position:relative;flex:1;min-height:0;overflow:hidden;touch-action:none}
canvas{position:absolute;inset:0;display:block;width:100%;height:100%}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 90% at 50% 45%,transparent 55%,rgba(0,0,0,.38))}
#warn{position:absolute;inset:0;pointer-events:none;opacity:0;background:linear-gradient(0deg,rgba(255,60,50,.55),rgba(255,60,50,0) 28%)}
#cur{position:absolute;inset:0;background:#0c1712;pointer-events:none;animation:cur 1.2s ease .2s both}
@keyframes cur{to{opacity:0;visibility:hidden}}
#hud{position:absolute;top:12px;left:12px;right:12px;display:flex;align-items:flex-start;justify-content:space-between;pointer-events:none}
.chip{display:flex;align-items:center;gap:7px;height:36px;padding:0 13px;border-radius:999px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-weight:700;font-size:14px}
.chip svg{width:17px;height:17px;color:var(--a1)}
#mid{text-align:center;text-shadow:0 2px 14px rgba(0,0,0,.35)}
#score{display:block;font-size:50px;font-weight:800;line-height:1;letter-spacing:-.03em}
#bestl{font-size:12px;font-weight:500;color:#fff;opacity:.85}
#right{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
#mute{pointer-events:auto;width:36px;padding:0;justify-content:center}
#mute.off{opacity:.5}
.ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(90% 70% at 50% 50%,rgba(6,14,10,.35),rgba(6,14,10,.72));padding:20px;overflow:auto}
.ov.first{animation:ovin .8s ease 1.5s both}
@keyframes ovin{from{opacity:0}to{opacity:1}}
.card{width:100%;max-width:340px;padding:28px 24px 22px;border-radius:26px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(18px) saturate(1.2);-webkit-backdrop-filter:blur(18px) saturate(1.2);box-shadow:0 24px 60px rgba(0,0,0,.45);text-align:center;animation:up .8s cubic-bezier(.2,.8,.2,1) both}
@keyframes up{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
#ttlrow{display:flex;justify-content:center;flex-wrap:wrap;font-size:36px;font-weight:800;letter-spacing:-.035em;line-height:1.05}
#ttlrow span{display:inline-block;animation:rise .8s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(26px);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
.sub{font-size:13px;color:var(--mut);margin:8px 0 22px;line-height:1.5}
#ttl{font-size:30px;font-weight:800;letter-spacing:-.03em;margin-bottom:16px}
.lbl{font-size:12px;font-weight:500;color:var(--mut);text-align:left;margin-bottom:8px}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.opt{flex:1 1 auto;display:flex;align-items:center;justify-content:center;gap:7px;min-height:42px;padding:0 12px;border-radius:12px;background:rgba(255,255,255,.07);border:1px solid var(--line);font-size:13px;font-weight:700;transition:background .15s,transform .1s}
.opt:active{transform:scale(.97)}
.opt.on{background:linear-gradient(135deg,var(--a1),var(--a2));border-color:transparent;color:#1d1204}
.go{width:100%;height:54px;border:0;border-radius:16px;background:linear-gradient(135deg,var(--a1),var(--a2));color:#1d1204;font-size:16px;font-weight:800;letter-spacing:-.01em;box-shadow:0 10px 26px rgba(255,138,31,.38),inset 0 1px 0 rgba(255,255,255,.5);transition:transform .1s}
.go:active{transform:scale(.98)}
.ghost{margin-top:14px;background:none;border:0;color:var(--mut);font-size:13px;font-weight:500;padding:6px}
#stats{display:flex;gap:8px;margin-bottom:20px}
#stats div{flex:1;padding:12px 4px;border-radius:14px;background:rgba(255,255,255,.07);border:1px solid var(--line)}
#stats b{display:block;font-size:26px;font-weight:800;letter-spacing:-.03em}
#stats span{font-size:11px;color:var(--mut)}
.pad{display:flex;gap:10px;padding:12px 14px 14px}
.pad button{flex:1;height:54px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:16px}
.pad button svg{width:24px;height:24px}
.pad button:active{background:rgba(255,255,255,.16)}
.pad .up{flex:1.7;background:linear-gradient(135deg,var(--a1),var(--a2));border-color:transparent;color:#1d1204}
.note{font-size:12px;color:var(--mut);text-align:left;margin:-8px 0 14px}
.row2{display:flex;gap:8px;margin-bottom:18px}
.row2 .opt{flex:1}
.opt.glow{animation:pulse 1.8s infinite;border-color:var(--a1)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,207,74,.55)}70%,100%{box-shadow:0 0 0 10px rgba(255,207,74,0)}}
.mini{display:inline-flex;align-items:center;gap:3px;font-size:12px;opacity:.85}
.mini svg{width:14px;height:14px;color:var(--a1)}
#shop .card,#settings .card{max-width:380px;max-height:100%;overflow:auto;padding:22px 18px;text-align:left}
.shead{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.shead h2{font-size:22px;font-weight:800;letter-spacing:-.03em}
.shead .chip{height:32px}
#grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.sk{padding:12px 10px;border-radius:16px;background:rgba(255,255,255,.07);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:7px}
.sk.cur{border-color:var(--a1)}
.sk svg{width:64px;height:64px;stroke:none}
.sk b{font-size:13px}
.sk button{width:100%;height:34px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.08);font-size:12px;font-weight:700}
.sk button.buy{background:linear-gradient(135deg,var(--a1),var(--a2));color:#1d1204;border-color:transparent}
.sk button.no{opacity:.5}
.sk button:disabled{opacity:.6}
#toast{position:absolute;top:64px;left:50%;transform:translate(-50%,-16px);opacity:0;pointer-events:none;transition:.35s;z-index:5;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}
.sk i{font-style:normal;font-size:10px;color:var(--a1);margin-top:-5px}
@keyframes hue{to{filter:hue-rotate(360deg)}}
@keyframes flick{from{filter:brightness(1) saturate(1)}to{filter:brightness(1.3) saturate(1.3);transform:translateY(-2px)}}
@keyframes zap{0%,80%,100%{filter:none}86%{filter:brightness(2.2)}92%{filter:none}96%{filter:brightness(1.8)}}
@keyframes flt{from{transform:translateY(0);opacity:.7}to{transform:translateY(-5px);opacity:.95}}
@keyframes gal{from{filter:hue-rotate(-25deg) brightness(.95)}to{filter:hue-rotate(35deg) brightness(1.25)}}
.a-rainbow svg{animation:hue 3s linear infinite}
.a-fire svg{animation:flick .45s ease-in-out infinite alternate}
.a-thunder svg{animation:zap 1.2s infinite}
.a-ghost svg{animation:flt 1.8s ease-in-out infinite alternate}
.a-galaxy svg{animation:gal 2.4s ease-in-out infinite alternate}
@media (prefers-reduced-motion:reduce){.sk svg{animation:none!important}}
.who{display:flex;align-items:center;gap:12px;text-align:left;padding:10px 12px;border-radius:16px;background:rgba(255,255,255,.07);border:1px solid var(--line);margin-bottom:18px}
.av{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--a1),var(--a2));color:#1d1204;display:flex;align-items:center;justify-content:center;font-weight:800;overflow:hidden;flex:none}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.wt{min-width:0}.wt b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wt span{font-size:12px;color:var(--mut)}
.opt[style*="--dot"]::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--dot);flex:none;border:1px solid rgba(255,255,255,.45)}
.ov{align-items:flex-start}
.ov>.card{margin:auto 0}
#homeb{pointer-events:auto;width:36px;padding:0;justify-content:center}
.grp{font-size:13px;font-weight:800;margin:18px 0 10px;letter-spacing:-.01em}
.grp:first-of-type{margin-top:0}
.set-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;font-size:14px;font-weight:700;border-top:1px solid var(--line)}
.sw{width:48px;height:28px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.12);position:relative;padding:0;transition:background .2s;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s}
.sw[aria-checked="true"]{background:linear-gradient(135deg,var(--a1),var(--a2));border-color:transparent}
.sw[aria-checked="true"]::after{transform:translateX(20px)}
#settings .shead .chip{cursor:pointer;color:inherit}
.hide{display:none!important}
@media (prefers-reduced-motion:reduce){#ttlrow span,.card,#cur,.ov.first{animation:none!important}}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="c"></canvas>
    <div id="vig"></div>
    <div id="warn"></div>
    <div id="hud">
      <button class="chip" id="homeb" aria-label="Home"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9H4zM10 20v-6h4v6"/></svg></button>
      <div id="mid"><span id="score">0</span><span id="bestl">Best <span id="best">0</span> on <span id="lvn">Medium</span></span></div>
      <div id="right">
        <div class="chip"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v8M9.5 10.5h5"/></svg><span id="coins">0</span></div>
        <button class="chip" id="mute" aria-label="Toggle sound"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 9a4 4 0 010 6M19 6.5a8 8 0 010 11"/></svg></button>
      </div>
    </div>
    <div class="ov first" id="ov">
      <div class="card">
        <div id="intro">
          <div class="who hide" id="who"><div class="av" id="av"></div><div class="wt"><b id="wname">Welcome</b><span id="wsub">Loading your progress...</span></div></div>
          <div id="ttlrow" aria-label="Chicken Cross"></div>
          <p class="sub">Cross busy roads and rivers. Don't stop moving.</p>
        </div>
        <h1 class="hide" id="ttl"></h1>
        <p class="hide" id="msg"></p>
        <div id="stats" class="hide"></div>
        <div id="sel">
          <div class="note" id="sumline"></div>
          <div class="row2">
            <button class="opt" id="shopb"><svg viewBox="0 0 24 24"><path d="M6 8h12l-1 12H7zM9 8a3 3 0 016 0"/></svg>Shop <span class="mini"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/></svg><span id="wal">0</span></span></button>
            <button class="opt" id="daily"><svg viewBox="0 0 24 24"><path d="M12 3c1 3 5 5 5 10a5 5 0 01-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-5 1-9z"/></svg><span id="dtxt">Daily reward</span></button>
          </div>
          <button class="opt" id="setb" style="width:100%;margin-bottom:18px"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 00-.1-1.2l2-1.5-2-3.4-2.3.9a7 7 0 00-2-1.2L14.2 3h-4l-.4 2.6a7 7 0 00-2 1.2l-2.3-.9-2 3.4 2 1.5A7 7 0 005 12c0 .4 0 .8.1 1.2l-2 1.5 2 3.4 2.3-.9a7 7 0 002 1.2l.4 2.6h4l.4-2.6a7 7 0 002-1.2l2.3.9 2-3.4-2-1.5c.1-.4.1-.8.1-1.2z"/></svg>Settings</button>
        </div>
        <button class="go" id="go">Start</button>
        <button class="ghost hide" id="menu">Home</button>
      </div>
    </div>
    <div class="ov hide" id="settings">
      <div class="card">
        <div class="shead"><h2>Settings</h2><button class="chip" id="sethome"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9H4zM10 20v-6h4v6"/></svg>Home</button></div>
        <div class="grp">Gameplay</div>
        <div class="lbl">Level</div>
          <div class="opts" id="lvl">
            <button class="opt" data-v="peasy">Peasy</button>
            <button class="opt" data-v="easy">Easy</button>
            <button class="opt" data-v="medium">Medium</button>
            <button class="opt" data-v="hard">Hard</button>
            <button class="opt" data-v="vhard">Very hard</button>
          </div>
          <div class="note" id="mult"></div>
        <div class="grp">World</div>
          <div class="lbl">Time of day</div>
          <div class="opts" id="tod">
            <button class="opt" data-v="day"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>Day</button>
            <button class="opt" data-v="dawn"><svg viewBox="0 0 24 24"><path d="M3 19h18M7 19a5 5 0 0110 0M12 7V3M9 5l3-3 3 3"/></svg>Dawn</button>
            <button class="opt" data-v="evening"><svg viewBox="0 0 24 24"><path d="M3 18h18M7 18a5 5 0 0110 0M12 5v4M5 10l2 2M19 10l-2 2"/></svg>Evening</button>
            <button class="opt" data-v="night"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 019.5 4a8 8 0 1010.5 10.5z"/></svg>Night</button>
            <button class="opt" data-v="rain"><svg viewBox="0 0 24 24"><path d="M7 14a4 4 0 01-.5-8 5 5 0 019.6 1A3.5 3.5 0 0116.5 14zM8 17l-1 3M12 17l-1 3M16 17l-1 3"/></svg>Rain</button>

            <button class="opt" data-v="desert" style="--dot:#e6c27c">Desert</button>

        <div class="grp">Sound and feel</div>
        <div class="set-row"><span>Sound effects</span><button class="sw" id="swSound" role="switch" aria-label="Sound effects" aria-checked="true"></button></div>
        <div class="set-row"><span>Vibration</span><button class="sw" id="swHaptic" role="switch" aria-label="Vibration" aria-checked="true"></button></div>

    </div>
    <div class="ov hide" id="shop">
      <div class="card">
        <div class="shead"><h2>Chicken shop</h2><div class="chip"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v8M9.5 10.5h5"/></svg><span id="wal2">0</span></div></div>

  <div class="pad" aria-label="Controls">
    <button id="bl" aria-label="Hop left"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button id="bd" aria-label="Hop back"><svg viewBox="0 0 24 24"><path d="M5 9l7 7 7-7"/></svg></button>
    <button id="bu" class="up" aria-label="Hop forward"><svg viewBox="0 0 24 24"><path d="M5 15l7-7 7 7"/></svg></button>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://sad.adsgram.ai/js/sad.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const API='https://calculator-production-740f.up.railway.app';
const TG=window.Telegram&&Telegram.WebApp;let runStart=0;
if(TG){try{TG.ready();TG.expand();TG.disableVerticalSwipes&&TG.disableVerticalSwipes();}catch(e){}}
let adCtl=null,adLast=0,adBusy=false,adWarned=false;
function adInit(){
  if(adCtl||!TG||!TG.initData||!window.Adsgram)return adCtl;
  try{adCtl=window.Adsgram.init({blockId:'int-46609'});}catch(e){console.log('Adsgram init failed',e);}
  return adCtl;
}
function showAd(){
  const c=adInit();
  if(!c||adBusy||Date.now()-adLast<20000)return;
  adBusy=true;adLast=Date.now();
  c.show().then(()=>{adBusy=false;unlockAudio();}).catch(r=>{
    adBusy=false;console.log('Adsgram:',r);
    if(!adWarned){adWarned=true;toast('Ad not shown: '+((r&&r.description)||'unavailable'));}
  });
}
function haptic(k){buzz(k);}
function api(path,body,keep){
  return fetch(API+'/api/deck/chicken/'+path,{method:'POST',keepalive:!!keep,headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.assign({init_data:TG.initData},body))})
    .then(r=>r.ok?r.json():r.json().catch(()=>({})).then(j=>{throw new Error(j.detail||('Error '+r.status))}));
}
let syncT=0,syncPending=false;
function flushSync(){
  if(!syncPending||!TG||!TG.initData)return Promise.resolve();
  clearTimeout(syncT);syncPending=false;
  return api('sync',{save},true).catch(()=>{syncPending=true;});
}
function queueSync(){if(!TG||!TG.initData)return;syncPending=true;clearTimeout(syncT);syncT=setTimeout(flushSync,800);}
document.addEventListener('visibilitychange',()=>{if(document.hidden)flushSync();});
addEventListener('pagehide',flushSync);
function renderWho(){
  const u=TG&&TG.initDataUnsafe&&TG.initDataUnsafe.user;if(!u)return;
  $('who').classList.remove('hide');
  const name=(prof&&prof.name)||u.first_name||'Player',av=$('av');
  $('wname').textContent='Welcome'+(prof&&prof.games?' back':'')+', '+name;
  if(!av.dataset.set){
    av.dataset.set=1;av.textContent=(name[0]||'?').toUpperCase();
    if(u.photo_url){const im=new Image();im.alt='';im.onload=()=>{av.textContent='';av.appendChild(im);};im.src=u.photo_url;}
  }
  const n=prof?(prof.coins||0):0,r=prof&&prof.ranks?prof.ranks.overall:null;
  $('wsub').textContent=prof?(r?'Coin rank #'+r+', '+n.toLocaleString()+' coins':'Unranked, collect coins to join the board'):'Loading your progress...';
}
function loadProfile(){
  if(!TG||!TG.initData){return;}
  api('profile',{}).then(p=>{
    prof=p;
    if(p.save&&(p.save.ts||0)>=(save.ts||0)){Object.assign(save,p.save);try{localStorage.setItem('cc_save',JSON.stringify(save))}catch(e){}}
    else queueSync();
    const spent=(save.owned||[]).reduce((a,id)=>a+((SKINS.find(k=>k.id===id)||{}).price||0),0);
    const floorBank=Math.max(0,(p.coins||0)-spent);
    if((save.bank||0)<floorBank){save.bank=floorBank;persist();}
    loadBest();hud();refreshMenu();
  }).catch(e=>{toast('Could not load progress: '+(e.message==='Failed to fetch'?'server unreachable':e.message));renderWho();});
}
function submitScore(){
  if(!TG||!TG.initData||maxRow<1)return;
  flushSync()
    .then(()=>api('score',{score:maxRow,coins:coins,level:level,secs:(performance.now()-runStart)/1000}))
    .then(j=>{if(j&&j.earned)toast('+'+j.earned+' coins added to the leaderboard');loadProfile();})
    .catch(e=>toast('Score not saved: '+(e.message==='Failed to fetch'?'server unreachable (CORS?)':e.message)));
}


const cv=$('c'),stage=$('stage');
const COLS=9,CAR=['#e8433a','#f2b632','#3c8dde','#8e5bd1','#f2f2f2','#27a58a'];
let W=0,H=0,R=null,P,cr,creep,maxRow,coins,gen,low,started,state='start',t=0,parts=[],best=0,world,fx=0,level='medium',tod='day',introT=0,bio='meadow',BI=null,th,prof=null;
const rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

const renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true});

function move(dc,dr){

function land(){

const tmp=new THREE.Vector3();
function update(dt){
  t+=dt;
  if(state==='start'){cr+=dt*.9;ensure(Math.ceil(cr)+30);}
  for(let i=Math.floor(cr)-8;i<=cr+26;i++){
    const r=R[i];if(!r)continue;
    if(r.type==='rail'){railTick(r,dt);continue;}
    if(r.cm)for(const k in r.cm)r.cm[k].rotation.y+=dt*3;
    if(r.rp)for(const m of r.rp){m.position.x+=r.v*.3*dt;if(m.position.x>12)m.position.x=-12;else if(m.position.x<-12)m.position.x=12;}
    for(const o of r.objs){
      o.x+=r.v*dt;if(o.x>=-8+r.span)o.x-=r.span;else if(o.x<-8)o.x+=r.span;
      if(o.m.userData.ball)o.m.userData.ball.rotation.z-=r.v*dt/.46;
      o.m.position.x=o.x+o.w/2-4.5;
    }
  }
  while(low<cr-14){if(R[low]){world.remove(R[low].g);}low++;}
  let warn=0;
  if(state==='play'){
    if(P.dead){P.deadT+=dt;if(P.deadT>.9)endGame();}
    else{
      if(P.hop<1){
        P.hop=Math.min(1,P.hop+dt/.12);
        P.dx=P.fx+(P.tx-P.fx)*P.hop;P.dr=P.fr+(P.r-P.fr)*P.hop;
        if(P.hop>=1)land();
      }else{
        const row=R[P.r];
        if(row.type==='water'){
          const o=onLog(row,P.dx+.5);
          if(o){P.dx+=row.v*dt;P.tx=P.dx;}else die('water');
          if(P.dx<-.45||P.dx>COLS-.55)die('drift');
        }
      }
      if(!P.dead){const row=R[Math.round(P.dr)];if(row&&HAZ[row.type]&&hitRoad(row,P.dx+.5))die('car');}
      if(!P.dead){
        tmp.set(P.dx-4,.5,-P.dr).project(camera);
        warn=clamp((-.6-tmp.y)/.35,0,1);
        if(tmp.y<-.97)die('eagle');
      }
      if(started)creep+=dt*(LV[level].cp+Math.min(maxRow/100,1)*.5);
    }
  }
  $('warn').style.opacity=state==='play'&&!P.dead?warn:0;
  if(state!=='start')cr+=(Math.max(maxRow,creep)-cr)*Math.min(1,dt*5);
  for(const p of parts){
    p.l-=dt*1.5;p.vy-=(p.gr===undefined?12:p.gr)*dt;
    p.m.position.x+=p.vx*dt;p.m.position.y=Math.max(0,p.m.position.y+p.vy*dt);p.m.position.z+=p.vz*dt;
    if(p.l<=0)world.remove(p.m);
  }
  parts=parts.filter(p=>p.l>0);
}
function animChicken(m,t,dt){
  const an=m.userData.an;if(!an)return;
  const T_=an.t,col=(q,h,sa,l)=>q.color.setHSL(((h%1)+1)%1,sa,l);
  for(const q of an.mats){
    if(T_==='ghost'){q.transparent=true;q.opacity=.6+.15*Math.sin(t*3);continue;}
    const r=q.userData.r;if(!r)continue;
    if(T_==='rainbow')col(q,t*.25+(r==='w'?.15:r==='c'?.5:0),.85,.62);
    else if(T_==='fire'){const f=.5+.5*Math.sin(t*14)*Math.sin(t*9);col(q,(r==='b'?.06:r==='w'?.03:.13)+.025*f,1,.5+.1*f);}
    else if(T_==='galaxy')col(q,r==='b'?.72+.05*Math.sin(t*.8):r==='w'?.62+.08*Math.sin(t*1.1):.9,.75,r==='b'?.26:.5);
    else if(T_==='thunder'&&r!=='c'){const fl=t%1.2<.14;q.color.setHex(r==='b'?(fl?0xffffff:0xffe14d):(fl?0xbfe8ff:0xffc400));}
  }
  if(T_==='ghost')m.position.y+=.28+.1*Math.sin(t*2.5);
  if(T_==='galaxy')an.stars.forEach((s,i)=>s.scale.setScalar(.03+.07*(.5+.5*Math.sin(t*4+i*1.7))));
  if(T_==='thunder'){const ph=t%1.2;if(ph<an.p&&m.visible&&!P.dead)burst(m.position.x,.8,m.position.z,'!#8fd0ff',6);an.p=ph;}
  if(T_==='fire'){
    an.acc+=dt;
    if(an.acc>.06&&m.visible&&!P.dead){an.acc=0;
      const f=box(.16,.16,.16,['!#ff4d00','!#ff9e1f','!#ffd23f'][Math.random()*3|0],m.position.x+rand(-.25,.25),m.position.y+.95,m.position.z+rand(-.1,.35),world);
      f.castShadow=false;parts.push({m:f,vx:rand(-.3,.3),vy:rand(1.4,2.4),vz:rand(-.3,.3),l:1,gr:-1});
    }
  }
}
function render(dt){
  const dp=clamp(P.deadT/.5,0,1),m=P.m;
  const hop=Math.sin(P.hop*Math.PI)*.55;
  const row=R[P.r],base=row&&row.type==='water'?.15:0;
  m.position.set(P.dx-4,base+hop,-P.dr);
  animChicken(m,t,dt);
  {const q=P.hop<1?1+Math.sin(P.hop*Math.PI)*.14:1+Math.sin(t*4)*.025,w=1/Math.sqrt(q);m.scale.set(w,q,w);}
  let d=P.face-m.rotation.y;d=Math.atan2(Math.sin(d),Math.cos(d));m.rotation.y+=d*Math.min(1,dt*20);
  m.visible=state!=='start';
  if(P.dead==='car'){m.scale.set(1.5,.15,1.4);}
  else if(P.dead==='water'||P.dead==='drift'){m.position.y=-dp*1.2;m.scale.setScalar(1-dp*.5);m.visible=dp<1;}
  else if(P.dead==='eagle'){m.position.y=P.deadT*8;}
  fx+=((P.dx-4)*.35-fx)*Math.min(1,dt*4);
  const fz=-(cr+3.2);
  tickRain(dt,fx,fz);
  introT+=dt;const ez=Math.min(1,introT/2.4);camera.zoom=.5+.5*(1-Math.pow(1-ez,3));camera.updateProjectionMatrix();

  sun.position.set(fx+th.so[0],th.so[1],fz+th.so[2]);sun.target.position.set(fx,0,fz);
  renderer.render(scene,camera);
}

  +(a==='viking'?'<path d="M14 22a18 12 0 0136 0z" fill="#8a8f9a"/><path d="M15 21l-7-14 10 8z" fill="#f1e6c8"/><path d="M49 21l7-14-10 8z" fill="#f1e6c8"/>':'')
  +(a==='wizard'?'<path d="M12 22h40l-9-3-6-17-6 17z" fill="#5a35a8"/><rect x="12" y="20" width="40" height="4" rx="2" fill="#4b2c8a"/>':'')
  +(a==='pirate'?'<path d="M14 22c0-9 6-13 18-13s18 4 18 13z" fill="#222"/><circle cx="32" cy="15" r="2.5" fill="#fff"/><circle cx="25" cy="32" r="4.4" fill="#000"/>':'')
  +(a==='astro'?'<rect x="11" y="12" width="42" height="28" rx="13" fill="#bfe8ff" opacity=".4"/>':'')
  +(a==='unicorn'?'<path d="M32 2l4 15h-8z" fill="#ffd23f"/><rect x="46" y="20" width="5" height="20" rx="2" fill="#ff8fd0"/>':'')
  +(a==='panda'?'<circle cx="19" cy="21" r="5" fill="#1b1b1b"/><circle cx="45" cy="21" r="5" fill="#1b1b1b"/><ellipse cx="25" cy="32" rx="5.5" ry="6.5" fill="#1b1b1b"/><ellipse cx="39" cy="32" rx="5.5" ry="6.5" fill="#1b1b1b"/><circle cx="25" cy="32" r="2.4" fill="#fff"/><circle cx="39" cy="32" r="2.4" fill="#fff"/>':'')
  +(a==='tiger'?'<path d="M14 40h8M42 40h8M14 47h7M43 47h7M27 21h10" stroke="#222" stroke-width="3" fill="none"/>':'')
  +(a==='santa'?'<path d="M16 22c2-10 10-14 18-12 5 1 8 5 9 12z" fill="#d32f2f"/><rect x="14" y="20" width="36" height="6" rx="3" fill="#fff"/><circle cx="44" cy="10" r="4" fill="#fff"/>':'')
  +(a==='hero'?'<path d="M12 28l-5 28 10-8z" fill="#d32f2f"/><path d="M52 28l5 28-10-8z" fill="#d32f2f"/><rect x="14" y="27" width="36" height="10" rx="4" fill="#1565c0"/><circle cx="25" cy="32" r="2.4" fill="#fff"/><circle cx="39" cy="32" r="2.4" fill="#fff"/>':'')
  +(a==='samurai'?'<path d="M14 22c0-9 8-13 18-13s18 4 18 13z" fill="#b71c1c"/><path d="M24 10l-3-8 8 6zM40 10l3-8-8 6z" fill="#ffd23f"/><rect x="14" y="21" width="36" height="4" fill="#7f0f0f"/>':'')
  +(k.anim==='fire'?'<path d="M22 22c-4-8 2-10 2-17 6 4 8 10 6 17zM34 20c-3-7 1-9 1-15 5 3 7 10 5 15z" fill="#ffd23f"/>':'')
  +(k.anim==='thunder'?'<path d="M35 3l-9 15h6l-3 12 12-17h-7z" fill="#4aa3ff"/>':'')
  +(k.anim==='galaxy'?'<circle cx="21" cy="26" r="1.6" fill="#fff"/><circle cx="42" cy="28" r="1.3" fill="#fff"/><circle cx="30" cy="48" r="1.5" fill="#fff"/><circle cx="44" cy="46" r="1.8" fill="#fff"/><circle cx="19" cy="44" r="1.2" fill="#fff"/>':'')
  +'</svg>';
}
function renderShop(){
  $('wal2').textContent=save.bank;
  $('grid').innerHTML=SKINS.map(k=>{
    const own=save.owned.includes(k.id),cur=save.skin===k.id;
    const btn=cur?'<button disabled>Equipped</button>':own?'<button data-id="'+k.id+'">Equip</button>':'<button class="buy'+(save.bank<k.price?' no':'')+'" data-id="'+k.id+'">'+k.price+' coins</button>';
    return '<div class="sk'+(cur?' cur':'')+(k.anim?' a-'+k.anim:'')+'">'+skinSVG(k)+'<b>'+k.name+'</b>'+(k.anim?'<i>Animated</i>':'')+btn+'</div>';
  }).join('');
}
$('grid').onclick=e=>{
  const b=e.target.closest('button[data-id]');if(!b)return;
  const k=SKINS.find(x=>x.id===b.dataset.id);
  if(!save.owned.includes(k.id)){
    if(save.bank<k.price){toast('Need '+(k.price-save.bank)+' more coins');return;}
    save.bank-=k.price;save.owned.push(k.id);buzz('success');snd(880,.14,'sine',.08,1320);
  }
  save.skin=k.id;persist();renderShop();refreshMenu();
};
$('shopb').onclick=()=>{renderShop();$('shop').classList.remove('hide');};
$('sback').onclick=()=>$('shop').classList.add('hide');
$('daily').onclick=()=>{
  const i=dailyInfo();
  if(i.claimed){toast('Come back tomorrow for +'+rw(i.streak+1)+' coins');return;}
  save.streak=i.streak;save.last=ymd(new Date());save.bank+=rw(i.streak);persist();
  buzz('success');toast('Day '+i.streak+' streak, +'+rw(i.streak)+' coins');snd(880,.14,'sine',.08,1320);refreshMenu();
};
function buzz(k){
  if(!cfg.hapt)return;
  try{
    const h=window.Telegram&&Telegram.WebApp&&Telegram.WebApp.HapticFeedback;
    if(h){
      if(k==='light'||k==='medium'||k==='heavy')h.impactOccurred(k);
      else if(k==='select')h.selectionChanged();
      else h.notificationOccurred(k);
      return;
    }
    if(navigator.vibrate)navigator.vibrate(k==='error'?[70,40,90]:k==='success'?[25,30,25]:k==='light'?12:25);
  }catch(e){}
}
let cfg={sound:true,hapt:true};
try{Object.assign(cfg,JSON.parse(localStorage.getItem('cc_cfg')||'{}'))}catch(e){}
function saveCfg(){try{localStorage.setItem('cc_cfg',JSON.stringify(cfg))}catch(e){}}
function applyCfg(){
  muted=!cfg.sound;$('mute').classList.toggle('off',muted);
  $('swSound').setAttribute('aria-checked',String(cfg.sound));$('swHaptic').setAttribute('aria-checked',String(cfg.hapt));
  renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
  resize();
}
applyCfg();
refreshMenu();
loadProfile();
setTimeout(()=>{if(state==='start')showAd();},1800);

let last=performance.now();
function frame(n){
  const dt=Math.min(.05,(n-last)/1000);last=n;
  if(!R&&W>0)init();
  if(R){update(dt);render(dt);}
  requestAnimationFrame(frame);
}
resize();requestAnimationFrame(frame);

$('go').onclick=start;$('mute').onclick=()=>{cfg.sound=!cfg.sound;saveCfg();applyCfg();};
$('swSound').onclick=$('mute').onclick;
$('swHaptic').onclick=()=>{cfg.hapt=!cfg.hapt;saveCfg();applyCfg();buzz('success');};
$('setb').onclick=()=>$('settings').classList.remove('hide');
$('sethome').onclick=$('setdone').onclick=()=>$('settings').classList.add('hide');
$('homeb').onclick=showMenu;
['mute','homeb'].forEach(id=>$(id).addEventListener('pointerdown',e=>e.stopPropagation()));$('menu').onclick=showMenu;
'Chicken Cross'.split('').forEach((ch,k)=>{const e=document.createElement('span');e.textContent=ch===' '?'\u00a0':ch;e.style.animationDelay=(1.3+k*.06)+'s';$('ttlrow').appendChild(e);});
function sel(id,get,fn){document.querySelectorAll('#'+id+' .opt').forEach(b=>{
  b.classList.toggle('on',b.dataset.v===get());
  b.onclick=()=>{document.querySelectorAll('#'+id+' .opt').forEach(x=>x.classList.toggle('on',x===b));fn(b.dataset.v);try{localStorage.setItem('cc_bio',bio);localStorage.setItem('cc_tod',tod);localStorage.setItem('cc_lvl',level)}catch(e){}};
});}
sel('tod',()=>tod,v=>{tod=v;applyTheme();refreshMenu();});
sel('bio',()=>bio,v=>{bio=v;BI=BIOMES[v];if(state==='start')init();refreshMenu();});
sel('lvl',()=>level,v=>{level=v;loadBest();hud();refreshMenu();});
const bind=(id,dc,dr)=>$(id).addEventListener('pointerdown',e=>{e.preventDefault();move(dc,dr);});
bind('bl',-1,0);bind('br',1,0);bind('bu',0,1);bind('bd',0,-1);
let px0=null,py0=null;
stage.addEventListener('pointerdown',e=>{px0=e.clientX;py0=e.clientY;});
stage.addEventListener('pointerup',e=>{
  if(px0===null)return;
  const dx=e.clientX-px0,dy=e.clientY-py0;px0=null;
  if(state!=='play')return;
  if(Math.hypot(dx,dy)<24)move(0,1);
  else if(Math.abs(dx)>Math.abs(dy))move(dx>0?1:-1,0);
  else move(0,dy<0?1:-1);
});
const KEYS={arrowup:[0,1],w:[0,1],arrowdown:[0,-1],s:[0,-1],arrowleft:[-1,0],a:[-1,0],arrowright:[1,0],d:[1,0]};
addEventListener('keydown',e=>{
  if(!$('shop').classList.contains('hide')||!$('settings').classList.contains('hide'))return;
  const k=e.key.toLowerCase();
  if(state!=='play'&&(k==='enter'||k===' ')){e.preventDefault();start();return;}
  const v=KEYS[k];
  if(v){e.preventDefault();move(v[0],v[1]);}
});
</script>
